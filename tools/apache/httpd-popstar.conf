# =====================================================================
#  POPSTAR Business Platform on XAMPP Apache
#  Included from httpd.conf (last line). Backup: httpd.conf.bak-popstar
#
#  http://localhost            -> D:/xampp/htdocs (unchanged, Popstarfoods etc.)
#  http://popstar.localhost    -> CRM   (web/crm/dist)    + /api -> Laravel
#  http://member.popstar.localhost -> Member (web/member/dist) + /api -> Laravel
#  http://127.0.0.1:18090      -> Laravel API (backend/public), loopback only
#
#  The project root keeps an .htaccess "Require all denied" so that
#  http://localhost/popstar-business-platform-v4/... (incl. backend/.env)
#  stays blocked. Only the folders granted below are served.
# =====================================================================
Define POPSTAR "D:/xampp/htdocs/popstar-business-platform-v4"

# --- Default site: must stay first so plain http://localhost keeps working
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "D:/xampp/htdocs"
</VirtualHost>

# --- Laravel API (backend/public) on loopback port 18090
Listen 127.0.0.1:18090
<VirtualHost 127.0.0.1:18090>
    ServerName 127.0.0.1
    DocumentRoot "${POPSTAR}/backend/public"
    <Directory "${POPSTAR}/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/popstar-api-error.log"
    CustomLog "logs/popstar-api-access.log" common
</VirtualHost>

# --- CRM frontend
<VirtualHost *:80>
    ServerName popstar.localhost
    DocumentRoot "${POPSTAR}/web/crm/dist"
    <Directory "${POPSTAR}/web/crm/dist">
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:18090/api/
    ProxyPassReverse /api/ http://127.0.0.1:18090/api/
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog "logs/popstar-crm-error.log"
    CustomLog "logs/popstar-crm-access.log" common
</VirtualHost>

# --- Member frontend
<VirtualHost *:80>
    ServerName member.popstar.localhost
    DocumentRoot "${POPSTAR}/web/member/dist"
    <Directory "${POPSTAR}/web/member/dist">
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:18090/api/
    ProxyPassReverse /api/ http://127.0.0.1:18090/api/
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog "logs/popstar-member-error.log"
    CustomLog "logs/popstar-member-access.log" common
</VirtualHost>
